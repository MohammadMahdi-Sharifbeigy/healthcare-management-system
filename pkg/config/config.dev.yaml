server:
  port: 8080
  environment: development
  timeout: 30s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: healthcare_db
  ssl_mode: disable
  pool_size: 25
  log_queries: true

jwt:
  secret_key: dev-secret-key
  expiration_hours: 24

cors:
  allowed_origins:
    - http://localhost:3000
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE

logging:
  level: debug
  format: json